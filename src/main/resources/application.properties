spring.application.name=blastradius

# Optional local overrides (gitignored): copy application-local.properties.example
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL — password via env SPRING_DATASOURCE_PASSWORD or application-local.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/blastradius
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
