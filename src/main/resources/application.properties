spring.application.name=blastradius

# Local overrides (gitignored): src/main/resources/application-local.properties
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL — password ONLY in application-local.properties or SPRING_DATASOURCE_PASSWORD env
spring.datasource.url=jdbc:postgresql://localhost:5432/blastradius
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Maven repository used to fetch remote parent POMs and imported BOMs, so versions declared
# only in e.g. spring-boot-dependencies still resolve to something concrete.
blastradius.maven.repository-url=https://repo1.maven.org/maven2
blastradius.maven.request-timeout=10s

# OSV.dev advisory source (Phase 3)
blastradius.osv.base-url=https://api.osv.dev
blastradius.osv.connect-timeout=5s
blastradius.osv.read-timeout=15s
